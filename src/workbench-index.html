<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>脑梗死工作台 · v%VERSION%</title>
<style>
:root{font:16px/1.6 system-ui,"PingFang SC","Microsoft YaHei",sans-serif;color:#1a1a1a;background:#f7f8fa;--red:#a3232d;--line:#d9dde3;--ink2:#4a4a4a}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer;min-height:44px}.shell{display:grid;grid-template-columns:190px minmax(0,1fr);min-height:100vh}.nav{background:#fff;border-right:1px solid var(--line);padding:20px 12px}.nav strong{display:block;padding:8px 10px 18px}.nav button{width:100%;border:0;text-align:left;background:transparent;padding:9px 12px;margin:2px 0}.nav button[aria-current=page]{border-left:3px solid var(--red);font-weight:700;background:#f1f2f4}.content{padding:clamp(18px,4vw,48px);max-width:1200px;width:100%;margin:auto}.card{background:white;border:1px solid var(--line);border-radius:3px;padding:20px;margin:0 0 16px}.urgent{border-left:5px solid var(--red)}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:8px 16px;border:1px solid var(--line);background:#fff;color:inherit;text-decoration:none;border-radius:3px;margin:4px}.primary{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}.field{display:block;margin:12px 0;max-width:700px}.field input,.field textarea,.field select{display:block;width:100%;padding:10px;border:1px solid #999;background:white}.muted{color:var(--ink2)}.notice{padding:12px;border:1px solid var(--line);margin:12px 0}.notice.alert{border-color:#d88;background:#fff1f0}.notice.warning{background:#fff6df}li{margin:6px 0}pre{white-space:pre-wrap;font:inherit}@media(max-width:650px){.shell{grid-template-columns:1fr}.nav{display:flex;overflow:auto;padding:6px;border-right:0;border-bottom:1px solid var(--line)}.nav strong{display:none}.nav button{white-space:nowrap;width:auto}.content{padding:16px}}
</style>
</head>
<body>
<div class="shell"><nav class="nav" aria-label="工作台导航"><strong>脑梗死工作台<br><small>暂定名 · 待用户追认</small></strong><button data-page="home" aria-current="page">急症首页</button><button data-page="handoff">就医交接</button><button data-page="records">资料整理</button><button data-page="profiles">档案管理</button><button data-page="settings">设置与隐私</button><button data-page="primer">疾病概要</button></nav><main class="content" id="app" tabindex="-1"><p role="status">载入本机工作区…</p></main></div>
<script>
const API='/api/cerebral-infarction-workbench';let model={subjects:[],documents:[],questions:[],dataDirectory:{configured:false}},page='home',handoffDraft=null,files=[];
const app=document.getElementById('app'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,options={}){const r=await fetch(API+path,{credentials:'same-origin',...options,headers:{...(options.body?{'content-type':'application/json'}:{}),...(options.headers||{})}});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||`服务错误 ${r.status}`);return j}
async function refresh(subjectId){try{model=await api('/bootstrap'+(subjectId?'?subjectId='+encodeURIComponent(subjectId):''));files=model.dataDirectory?.configured?(await api('/files')).files||[]:[]}catch(e){model.error=e.message}}
function nav(){document.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-current',b.dataset.page===page?'page':'false'))}
function subjectOptions(){return (model.subjects||[]).map(s=>`<option value="${esc(s.id)}" ${s.id===model.activeSubjectId?'selected':''}>${esc(s.displayLabel)}${s.isDemo?'（合成示例）':''}</option>`).join('')}
function render(){nav();let html='';if(page==='home')html=`<h1>突然出现新的神经症状？</h1><section class="card urgent"><h2>先呼救，不等待应用判断</h2><p>任何突然出现的面部、肢体、言语、平衡或视力异常，都应立即联系当地急救服务。症状暂时好转也不要延迟求助。</p><a class="btn primary" href="tel:120">拨打120</a><p class="muted">中国大陆急救电话；其他地区使用当地急救号码。电话行为取决于设备和系统设置。</p></section><section class="card"><h2>FAST / BE-FAST识别提示</h2><p><b>F 面部：</b>是否一侧面部不对称？</p><p><b>A 手臂：</b>是否突然无力或麻木？</p><p><b>S 言语：</b>是否含糊或难以理解？</p><p><b>B 平衡、E 眼部：</b>是否突然失衡或视力异常？</p><p><b>T 时间：</b>立即求助；记录最后正常时间不应耽误呼叫。</p><p class="notice alert">FAST提示不能排除卒中或其他急症。即使症状缓解，也联系急救服务。</p></section><section class="card"><h2>院内评估时间窗信息</h2><p>公开指南记载部分静脉溶栓评估常见窗口为发病后4.5小时内；特定情况还可能按影像等条件评估更晚窗口，部分机械取栓评估窗口可至24小时。以上不是个人资格判断、治疗建议或等待时限。请立即联系急救服务。</p><button class="btn" data-page="handoff">呼救后准备可选交接信息</button></section>`;
else if(page==='handoff')html=`<h1>可选就医交接</h1><p class="notice alert">疑似卒中请先呼救。填写内容不是求助前置条件；不清楚的项目留空即可。</p><section class="card"><label class="field">最后正常/发现时间（可空）<input id="time" type="datetime-local"></label><label class="field">观察到的变化（照原话）<textarea id="symptoms" rows="3"></textarea></label><label class="field">提供者<select id="reporter"><option value="caregiver">照护者/见证人</option><option value="self">本人</option></select></label><label class="field">补充病史（可空）<textarea id="history" rows="3"></textarea></label><button class="btn primary" id="make">生成临时摘要</button><div id="summary"></div></section>`;
else if(page==='records')html=`<h1>资料整理</h1><p class="muted">原件留在所选本机目录；这里只登记来源和路径，不上传或自动解析文件内容。</p><section class="card"><h2>${esc(model.subjects?.find(s=>s.id===model.activeSubjectId)?.displayLabel||'未选档案')}</h2><ul>${(model.documents||[]).map(d=>`<li>${esc(d.documentDate||'日期未核')} · ${esc(d.displayLabel)} · ${esc(d.reviewState)} · ${d.originalAttached?'原件在目录':'原件未找到'}</li>`).join('')}</ul>${model.dataDirectory?.configured?`<label class="field">目录文件<select id="file"><option value="">选择文件</option>${files.map(f=>`<option>${esc(f)}</option>`).join('')}</select></label><button class="btn" id="indexFile">索引所选文件</button>`:'<p>未选择资料目录。急症信息仍可使用。</p>'}</section><section class="card"><h2>留给医护人员的问题</h2><label class="field">问题草稿<textarea id="question" rows="3"></textarea></label><button class="btn" id="saveQuestion">保存私密问题</button><ul>${(model.questions||[]).map(q=>`<li>${esc(q.questionText)} · ${q.isPrivate?'私密':''} · 未核实</li>`).join('')}</ul></section>`;
else if(page==='profiles')html=`<h1>档案管理</h1><section class="card"><label class="field">当前档案<select id="subject">${subjectOptions()}</select></label><label class="field">新档案显示名称<input id="subjectName" maxlength="80"></label><button class="btn primary" id="newSubject">新建本机档案</button><ul>${(model.subjects||[]).map(s=>`<li>${esc(s.displayLabel)}${s.isDemo?'（合成示例）':'（本机档案）'}</li>`).join('')}</ul></section>`;
else if(page==='settings')html=`<h1>设置与隐私边界</h1><section class="card"><h2>本机资料目录</h2><p>${model.dataDirectory?.configured?'已选择：'+esc(model.dataDirectory.dir):'尚未选择；急症信息可直接使用。'}</p><button class="btn" id="pickDir">选择目录</button><p id="dirStatus" role="status"></p></section><section class="card"><h2>医学资料与隐私</h2><p>来源、访问日期及原件核验状态见疾病概要。临床专业审核未完成。</p><p>资料写入所选本机目录。AI对话由宿主提供；只有用户明确提交的内容才会发送。</p></section>`;
else if(page==='primer')html=`<h1>疾病概要</h1><div id="primerContent">加载公开资料…</div><p>这一句需要问你的医生。</p>`;
app.innerHTML=(model.error?`<p class="notice" role="alert">本机记录服务不可用：${esc(model.error)}；急症提示保持可见。</p>`:'')+html+`<p class="muted" role="status" id="status"></p>`;wire();if(page==='primer')loadPrimer()}
function message(text){const el=document.getElementById('status');if(el)el.textContent=text}
function wire(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));document.getElementById('make')?.addEventListener('click',()=>{const g=id=>document.getElementById(id).value||'未知/未填写';handoffDraft={time:g('time'),symptoms:g('symptoms'),reporter:document.getElementById('reporter').value,history:g('history')};const text=`就医交接（本人/照护者提供，未经核实）\n最后正常/发现时间：${handoffDraft.time}\n观察情况：${handoffDraft.symptoms}\n补充病史：${handoffDraft.history}`;document.getElementById('summary').innerHTML=`<pre class="card">${esc(text)}</pre><button class="btn" id="copy">复制摘要</button><button class="btn" id="saveEvent">保存到所选本机档案</button>`;document.getElementById('copy').onclick=()=>navigator.clipboard?.writeText(text).then(()=>message('已复制'));document.getElementById('saveEvent').onclick=saveEvent});
document.getElementById('indexFile')?.addEventListener('click',async()=>{try{const f=document.getElementById('file').value;if(!f)throw Error('请先选择文件');await api('/documents',{method:'POST',body:JSON.stringify({subjectId:model.activeSubjectId,relativePath:f,displayLabel:f.split('/').pop()})});await refresh(model.activeSubjectId);render();message('已登记来源与路径，文件内容未上传或解析')}catch(e){message(e.message)}});
document.getElementById('saveQuestion')?.addEventListener('click',async()=>{try{await api('/questions',{method:'POST',body:JSON.stringify({subjectId:model.activeSubjectId,questionText:document.getElementById('question').value,isPrivate:true})});await refresh(model.activeSubjectId);render();message('问题已保存为私密草稿')}catch(e){message(e.message)}});
document.getElementById('subject')?.addEventListener('change',async e=>{await refresh(e.target.value);render()});document.getElementById('newSubject')?.addEventListener('click',async()=>{try{const name=document.getElementById('subjectName').value;model=await api('/subjects',{method:'POST',body:JSON.stringify({displayLabel:name,subjectRole:'self'})});render();message('本机档案已创建')}catch(e){message(e.message)}});
document.getElementById('pickDir')?.addEventListener('click',()=>{parent.postMessage({type:'cerebral-infarction-workbench:directory-pick'},location.origin);message('等待宿主目录选择器…')})}
async function saveEvent(){if(!model.activeSubjectId){message('请先选择或创建档案');return}if(!confirm('将由你提供的信息保存到当前本机档案，继续？'))return;try{const value=document.getElementById('time').value;const observations=[handoffDraft.symptoms!=='未知/未填写'&&`观察情况：${handoffDraft.symptoms}`,handoffDraft.history!=='未知/未填写'&&`补充病史（未核实）：${handoffDraft.history}`].filter(Boolean).join('\n');await api('/acute-events',{method:'POST',body:JSON.stringify({subjectId:model.activeSubjectId,reporterRole:handoffDraft.reporter,timepoints:value?[{timeKind:'last_known_well',precision:'exact',value,timezone:Intl.DateTimeFormat().resolvedOptions().timeZone}]:[{timeKind:'last_known_well',precision:'unknown'}],observations:observations?[{signKey:'other',state:'present',note:observations}]:[]})});await refresh(model.activeSubjectId);message('已保存为未经核实的自述记录')}catch(e){message(e.message)}}
async function loadPrimer(){try{const d=await api('/primer');document.getElementById('primerContent').innerHTML=d.sections.map(s=>`<section class="card"><h2>${esc(s.title)}</h2>${(s.paragraphs||[]).map(p=>`<p>${esc(p)}</p>`).join('')}${(s.facts||[]).map(p=>`<p>${esc(p)}</p>`).join('')}${(s.sources||[]).map(x=>`<p><a href="${esc(x.url)}" target="_blank" rel="noreferrer">${esc(x.org)}</a>：${esc(x.note||'')}</p>`).join('')}</section>`).join('')+`<section class="card"><h2>来源</h2><ul>${d.sources.map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noreferrer">${esc(s.name)}</a>（${esc(s.note)}）</li>`).join('')}</ul></section>`}catch(e){document.getElementById('primerContent').textContent='疾病概要暂不可用：'+e.message}}
function go(next){page=next;render();app.focus({preventScroll:true})}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==parent)return;if(e.data?.type==='cerebral-infarction-workbench:root-changed'){refresh().then(()=>{render();message('资料目录已设置')})}if(e.data?.type==='cerebral-infarction-workbench:open-primer')go('primer')});
refresh().then(render);
</script>
</body></html>
