<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>脑梗死工作台 · 交互原型 v0.1.0</title>
<style>
:root{--bg:#f7f8fa;--paper:#fff;--ink:#1a1a1a;--ink2:#4a4a4a;--muted:#717784;--line:#d9dde3;--red:#a3232d;--red-soft:#fff1f0;--green:#1f6a50;--green-soft:#edf7f2;--gold:#8b6414;--gold-soft:#fff6df;--radius:3px;--font:Arial,"Noto Sans SC","PingFang SC",sans-serif;--agent-width:35%;font-synthesis:none;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--font)}button,input,select,textarea{font:inherit}button{cursor:pointer}main:focus{outline:none}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #3067a3;outline-offset:2px}.topbar{min-height:76px;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:24px;padding:12px 28px}.brand{min-width:250px}.brand strong{display:block;font-size:19px;line-height:1.3}.brand small{color:var(--muted);font-size:12px}.version{font-size:12px;color:var(--ink2);border:1px solid var(--line);padding:2px 7px;margin-left:8px;white-space:nowrap}.status{flex:1;color:var(--ink2);font-size:14px}.top-actions{display:flex;gap:8px;align-items:center}.button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:var(--radius);padding:9px 14px;min-height:44px}.button:hover{background:#f2f3f5}.button.primary{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}.button.primary:hover{background:#851923}.button.subtle{border-color:transparent}.layout{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:calc(100vh - 77px)}.sidenav{border-right:1px solid var(--line);padding:28px 14px;background:var(--paper)}.nav-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:0 12px 12px}.navitem{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:transparent;padding:12px;border-radius:var(--radius);color:var(--ink2);margin:2px 0}.navitem:hover{background:#f2f3f5}.navitem.active{background:#f0f1f3;color:var(--ink);font-weight:700;border-left:3px solid var(--red)}.nav-icon{width:22px;text-align:center;font-weight:700}.side-note{margin:40px 10px 0;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}main{min-width:0;padding:32px clamp(20px,4vw,64px) 60px;max-width:1380px;width:100%;margin:0 auto}.demo-flag{display:inline-block;background:#f1f2f4;color:#535964;padding:4px 8px;font-size:12px;letter-spacing:.02em;margin-bottom:14px}.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}.page-title{font-size:30px;line-height:1.2;margin:0 0 12px;font-weight:700}.lede{max-width:760px;color:var(--ink2);margin:0 0 28px}.section-title{font-size:19px;margin:0 0 14px}.urgent-panel{background:var(--paper);border-left:5px solid var(--red);padding:24px 28px;margin:0 0 28px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:22px}.urgent-panel h2{font-size:22px;margin:0 0 6px}.urgent-panel p{margin:0;color:var(--ink2);max-width:640px}.urgent-panel .button{min-width:258px;min-height:56px;font-size:17px}.urgent-foot{font-size:13px!important;color:var(--muted)!important;margin-top:8px!important}.notice{padding:14px 16px;border:1px solid var(--line);background:#fff;margin:14px 0 24px}.notice.warning{background:var(--gold-soft);border-color:#ead7a6}.notice.urgent{background:var(--red-soft);border-color:#e7b9bb;color:#582127}.notice.success{background:var(--green-soft);border-color:#b8d9cb;color:#174e3b}.symptom-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);margin-bottom:28px}.symptom{background:#fff;padding:18px 20px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:112px}.symptom b{font-size:14px;color:var(--red);display:block;letter-spacing:.04em}.symptom span{display:block;margin-top:6px;color:var(--ink2)}.split{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(260px,.8fr);gap:28px}.plain-section{padding:22px 0;border-top:1px solid var(--line)}.plain-section p{margin:0;color:var(--ink2)}.action-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.field label{display:block;font-weight:700;font-size:14px;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid #9ca3ac;background:white;padding:11px;border-radius:var(--radius);min-height:46px}.field textarea{min-height:90px;resize:vertical}.help{font-size:13px;color:var(--muted);margin:5px 0 0}.checkrow{display:flex;gap:10px;align-items:flex-start;margin:8px 0}.checkrow input{width:20px;height:20px;margin-top:2px}.data-table{width:100%;border-collapse:collapse;background:white}.data-table th,.data-table td{text-align:left;padding:13px;border-bottom:1px solid var(--line)}.data-table th{font-size:13px;color:var(--ink2);font-weight:700}.settings-block{max-width:850px;border-top:1px solid var(--line);padding:20px 0}.settings-block h2{font-size:17px;margin:0 0 6px}.status-pill{display:inline-block;padding:2px 8px;border:1px solid var(--line);font-size:12px;background:#f7f8fa}.status-pill.pending{color:var(--gold);background:var(--gold-soft);border-color:#ead7a6}.footer-note{border-top:1px solid var(--line);margin-top:40px;padding-top:18px;color:var(--muted);font-size:12px}.agent-pane{grid-column:4;grid-row:1;position:relative;z-index:1;min-width:0;background:white;border-left:1px solid #9ca3ac;display:none;overflow:auto}.agent-pane.open{display:flex;flex-direction:column}.agent-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.agent-head strong{font-size:15px}.agent-content{padding:24px;overflow:auto}.host-placeholder{border:1px dashed #9ca3ac;background:#fafafa;padding:22px;min-height:180px;color:var(--ink2)}.host-placeholder strong{display:block;color:var(--ink);margin-bottom:8px}.agent-controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.separator{position:relative;z-index:2;grid-column:3;grid-row:1;width:8px;cursor:col-resize;display:none;touch-action:none}.layout.agent-open .separator{display:block}.separator:focus{outline:3px solid #3067a3;outline-offset:-3px}.page-view{position:fixed;inset:0;background:var(--bg);z-index:10;overflow:auto;display:none}.page-view.open{display:block}.page-head{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;z-index:2}.page-head h1{font-size:20px;margin:0}.page-body{max-width:980px;margin:36px auto;padding:0 24px 60px}.page-body h2{font-size:20px;margin:30px 0 10px}.page-body p,.page-body li{color:var(--ink2);line-height:1.8}.source-list{padding-left:20px;font-size:14px}.dialog-backdrop{position:fixed;z-index:20;inset:0;background:#14182080;display:none;align-items:center;justify-content:center;padding:20px}.dialog-backdrop.open{display:flex}.dialog{background:white;max-width:520px;width:100%;padding:24px;border-top:4px solid var(--red)}.dialog h2{margin:0 0 10px}.dialog p{color:var(--ink2)}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}.toast{position:fixed;z-index:30;bottom:20px;left:50%;transform:translateX(-50%);padding:12px 18px;background:#222;color:white;display:none;max-width:min(600px,90vw)}.toast.show{display:block}.mobile-agent-toggle{display:none}
@media(max-width:900px){.symptom-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:1fr}.topbar{padding:10px 18px;gap:14px}.brand{min-width:220px}.status{display:none}main{padding:24px 22px 48px}}
@media(max-width:760px){.topbar{min-height:84px;flex-wrap:wrap;gap:6px 12px}.brand{flex:1;min-width:180px}.top-actions{order:3;width:100%;justify-content:flex-end}.layout{grid-template-columns:68px minmax(0,1fr)}.sidenav{padding:16px 7px}.nav-label{display:none}.navitem{justify-content:center;padding:12px 4px}.navitem .nav-text{display:none}.side-note{display:none}main{padding:22px 18px 40px}.urgent-panel{grid-template-columns:1fr}.urgent-panel .button{width:100%}.agent-pane{min-width:0}.separator{display:block}.mobile-agent-toggle{display:block}}
@media(max-width:620px){.topbar{padding:10px 14px}.brand strong{font-size:16px}.version{margin-left:4px}.layout{grid-template-columns:68px minmax(0,1fr)}.sidenav{padding:16px 6px}.nav-label,.navitem .nav-text,.side-note{display:none}.navitem{justify-content:center;padding:12px 4px}main{padding:18px 14px 40px}.page-title{font-size:25px}.symptom-grid{grid-template-columns:1fr}.symptom{min-height:75px;padding:13px 15px}.urgent-panel{padding:20px 17px}.urgent-panel .button{min-width:0}.form-grid{grid-template-columns:1fr}.page-body{margin:22px auto;padding:0 18px 48px}.page-head{padding:12px 16px}.page-head h1{font-size:18px}.agent-pane{min-width:0}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><strong>脑梗死工作台 <span class="version">v0.1.0</span></strong><small>暂定名 · 待用户追认</small></div>
  <div class="status">疑似卒中时：先联系急救服务，再考虑记录</div>
  <div class="top-actions"><button class="button" id="primerOpen" aria-label="打开疾病概要">? 疾病概要</button><button class="button" id="agentToggle">打开 AI 对话</button><button class="button" data-view="settings">设置</button></div>
</header>
<div class="layout">
  <nav class="sidenav" aria-label="工作台页面">
    <div class="nav-label">工作台</div>
    <button class="navitem active" data-view="home"><span class="nav-icon">!</span><span class="nav-text">急症识别</span></button>
    <button class="navitem" data-view="handoff"><span class="nav-icon">↗</span><span class="nav-text">就医准备</span></button>
    <button class="navitem" data-view="records"><span class="nav-icon">≡</span><span class="nav-text">资料整理</span></button>
    <button class="navitem" data-view="settings"><span class="nav-icon">⚙</span><span class="nav-text">隐私与设置</span></button>
    <div class="side-note">急症入口无需登录。交接信息可跳过，不能延误呼救。</div>
  </nav>
  <main id="main" tabindex="-1"></main>
  <div class="separator" id="separator" role="separator" aria-label="调整右侧 AI 面板宽度" aria-orientation="vertical" aria-valuemin="25" aria-valuemax="45" aria-valuenow="35" tabindex="0"></div>
  <aside class="agent-pane" id="agentPane" aria-label="AI 对话宿主模拟">
  <div class="agent-head"><strong>DSH 原生 Agent 面板</strong><button class="button" id="agentHide" aria-label="隐藏 AI 对话面板">隐藏</button></div>
  <div class="agent-content">
    <span class="status-pill pending">宿主模拟 · 非真实 DSH 会话</span>
    <h2>此处由 DSH Desktop 提供原生对话界面</h2>
    <div class="host-placeholder"><strong>原生会话尚未连接</strong>原型不展示假聊天记录、不创建会话，也不发送患者资料。生产集成需按 Desktop API 验证 newSession / subscribe、会话归属和草稿冲突保护。</div>
    <div class="agent-controls"><button class="button" data-agent-state="loading">演示连接中</button><button class="button" data-agent-state="error">演示连接失败</button><button class="button" data-agent-state="draft">演示已有草稿冲突</button></div>
    <p id="agentStateText" class="help" aria-live="polite">当前状态：未连接。隐藏后工作台输入与滚动状态保留。</p>
  </div>
</aside>
</div>
<section class="page-view" id="primerView" aria-labelledby="primerTitle" aria-hidden="true">
  <div class="page-head"><button class="button" data-back>← 返回</button><h1 id="primerTitle">脑梗死疾病概要</h1><button class="button" data-close>关闭 ×</button></div>
  <div class="page-body" id="primerBody"></div>
</section>
<div class="dialog-backdrop" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><div class="dialog"><h2 id="dialogTitle">交互原型演示</h2><p id="dialogText"></p><div class="dialog-actions"><button class="button" id="dialogCancel">返回</button><button class="button primary" id="dialogConfirm">继续</button></div></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="./primer-data.js"></script>
<script>
function renderPrimer(){
  const d=window.DISEASE_PRIMER;if(!d)return;
  const body=document.getElementById('primerBody');
  const escapeHtml=value=>String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const sections=d.sections.map(section=>`<h2>${escapeHtml(section.title)}</h2>${(section.paragraphs||[]).map(text=>`<p>${escapeHtml(text)}</p>`).join('')}${section.facts?`<ul>${section.facts.map(text=>`<li>${escapeHtml(text)}</li>`).join('')}</ul>`:''}`).join('');
  const sources=d.sources.map(source=>`<li><a href="${escapeHtml(source.url)}" target="_blank" rel="noreferrer">${escapeHtml(source.name)}</a>，${escapeHtml(source.note)}</li>`).join('');
  body.innerHTML=`<p class="demo-flag">医学资料说明 · 仅供理解 · 不用于诊断或治疗决策</p>${sections}<h2>来源与访问状态</h2><ul class="source-list">${sources}</ul><p class="notice warning">指南版本、地区、适用人群和原件状态会变化。未取得官方原件或无法核实时，摘要仅作通用说明，不代表当前个体建议。</p>`;
}
renderPrimer();
const main=document.getElementById('main'),toast=document.getElementById('toast'),dialog=document.getElementById('dialog');
let current='home',draft={},historyStack=[],dialogAction=null,agentOpen=false,previousFocus=null;
const views={
home:`<span class="demo-flag">交互原型 · 合成内容 · 不会拨打电话</span><p class="eyebrow">先行动，再记录</p><h1 class="page-title">突然出现新的神经症状？</h1><p class="lede">不要等页面判断。任何突发的面部、肢体、言语、平衡或视力异常，都应立即联系当地急救服务；症状短暂好转也一样。</p><section class="urgent-panel"><div><h2>疑似卒中，先联系急救服务</h2><p>中国大陆拨打 120；其他地区请使用当地急救号码。尽量记下症状开始或最后正常的时间（不确定可留空）。</p><p class="urgent-foot">原型按钮只演示交互，不会实际拨号；正式号码需按部署地区核验。</p></div><button class="button primary" id="callHelp">模拟：联系急救服务（120）</button></section><div class="notice urgent"><strong>FAST/中风120是识别提示，不是排除工具。</strong>即使某些项目正常、症状减轻或消失，也不要因此延迟急救评估。</div><div class="plain-section"><h2 class="section-title">为什么要记下症状时间？</h2><p>指南记载，部分患者的静脉溶栓评估以发病4.5小时内为常见窗口；符合特定影像等标准时还可能评估更晚窗口；部分大血管闭塞患者可在筛选后评估至24小时内机械取栓。是否适用由卒中团队决定。<strong>不论症状出现多久或时间是否清楚，都应立即联系急救服务；不要等待，也不要自行判断“过窗”。</strong></p><p class="help">来源： 《中国急性缺血性卒中诊治指南2023》及《中国卒中学会急性缺血性卒中再灌注治疗指南2024》，全文链接见疾病概要。临床审核待完成。</p></div><h2 class="section-title">突然发生的这些变化也要重视</h2><div class="symptom-grid"><div class="symptom"><b>B · 平衡</b><span>突然失去平衡、协调困难或行走困难</span></div><div class="symptom"><b>E · 眼睛</b><span>突然视力变化、复视或视物困难</span></div><div class="symptom"><b>F · 面部</b><span>一侧面部不对称或麻木</span></div><div class="symptom"><b>A · 手臂</b><span>一侧手臂突然无力或麻木</span></div><div class="symptom"><b>S · 言语</b><span>说话含混或理解困难</span></div><div class="symptom"><b>T · 时间</b><span>立即求助；记录时间不应耽误呼叫</span></div></div><div class="split"><section class="plain-section"><h2 class="section-title">呼叫之后，可选准备交接信息</h2><p>资料不齐也没关系。可把症状、时间、目击者和已知病史口述给急救人员；任何一项都可跳过。</p><div class="action-row"><button class="button" data-view="handoff">打开就医准备清单 →</button></div></section><section class="plain-section"><h2 class="section-title">稳定之后，再整理资料</h2><p>用原件和来源记录病情，形成复诊问题；不在这里判断治疗方案。</p><div class="action-row"><button class="button" data-view="records">整理脑梗死资料 →</button></div></section></div><div class="footer-note">医学说明以公开指南和来源页为准。此原型不提供诊断、用药或个体治疗资格判断。</div>`,
handoff:`<span class="demo-flag">合成数据 · 仅本页临时状态 · 不会保存或发送</span><p class="eyebrow">呼救后再做 · 可跳过</p><h1 class="page-title">就医准备清单</h1><p class="lede">先联系急救服务。下面的信息仅帮助交接，不是治疗判断。不了解的内容选“未知”或留空。</p><div class="notice warning">不要为了填写清单而推迟呼救；本原型不会把内容写入长期档案。</div><form id="handoffForm"><div class="form-grid"><div class="field"><label for="lastNormal">最后一次看起来正常的时间（如知道）</label><input id="lastNormal" type="datetime-local"><p class="help">不确定可留空，不要猜测。</p></div><div class="field"><label for="noticed">发现异常的时间（如知道）</label><input id="noticed" type="datetime-local"></div><div class="field"><label for="observer">记录者/目击者关系（可选）</label><select id="observer"><option value="">未知/跳过</option><option>本人</option><option>家属或照护者</option><option>其他目击者</option></select></div><div class="field"><label for="history">已知病史、过敏或目前用药（仅供告知）</label><textarea id="history" placeholder="可留空；不要在此更改或停用药物"></textarea></div></div><fieldset style="border:0;padding:18px 0 0;margin:0"><legend class="section-title">观察到的突然变化（可选）</legend><div class="form-grid"><label class="checkrow"><input type="checkbox" name="symptom" value="平衡/行走变化">平衡或行走变化</label><label class="checkrow"><input type="checkbox" name="symptom" value="视力变化">视力变化</label><label class="checkrow"><input type="checkbox" name="symptom" value="面部不对称/麻木">面部不对称或麻木</label><label class="checkrow"><input type="checkbox" name="symptom" value="单侧手臂无力/麻木">单侧手臂无力或麻木</label><label class="checkrow"><input type="checkbox" name="symptom" value="言语变化">言语或理解变化</label><label class="checkrow"><input type="checkbox" name="symptom" value="其他突发异常">其他突发异常</label></div></fieldset><div class="action-row"><button type="button" class="button primary" id="makeSummary">生成口述摘要</button><button type="button" class="button" id="resetDraft">清空临时信息</button><button type="button" class="button" data-view="home">返回首页</button></div></form><section class="plain-section" id="summaryBlock" hidden><h2 class="section-title">交接摘要 <span class="status-pill">本人/照护者提供 · 未核实</span></h2><textarea id="summaryText" aria-label="临时交接摘要" style="width:100%;min-height:120px;padding:12px"></textarea><div class="action-row"><button class="button" id="copySummary">复制摘要</button></div></section><div class="footer-note">本地原型内存状态；刷新页面即清除。不要输入真实患者资料。</div>`,
records:`<span class="demo-flag">合成内容 · 资料索引示意 · 未连接本机目录</span><p class="eyebrow">稳定后使用</p><h1 class="page-title">整理脑梗死资料</h1><p class="lede">按日期收纳来源和原件，准备复诊问题。示例为合成数据，不是真实病例。</p><div class="notice">状态：尚未连接患者资料目录。这里显示的记录不代表已建立真实档案。</div><table class="data-table"><thead><tr><th>日期</th><th>资料</th><th>来源状态</th><th>可做什么</th></tr></thead><tbody><tr><td>示例 · 2026-10-01</td><td>出院记录（合成）</td><td>待本人核对</td><td><button class="button" data-toast="示意：查看合成资料条目">查看</button></td></tr><tr><td>示例 · 2026-10-02</td><td>影像报告（合成）</td><td>原件未附</td><td><button class="button" data-toast="示意：原件路径不会在原型中创建">补充来源</button></td></tr></tbody></table><section class="plain-section"><h2 class="section-title">复诊时想问的问题</h2><div class="field"><label for="questionDraft">问题草稿（本地演示）</label><textarea id="questionDraft" placeholder="例如：我想请医生解释这份报告中的术语"></textarea><p class="help">原型不会分析或回答治疗问题。</p></div><div class="action-row"><button class="button" data-toast="原型演示：正式实现需确认后保存">保存问题草稿</button><button class="button" data-view="home">返回首页</button></div></section><div class="footer-note">不提供用药建议，不把用户自述或AI整理内容写成已核实诊断。</div>`,
settings:`<span class="demo-flag">设置交互原型 · 不会访问真实文件</span><p class="eyebrow">个人资料与隐私</p><h1 class="page-title">隐私与设置</h1><p class="lede">患者资料、临床参考资料和原生会话是不同状态；本页只演示设置，不会选择或读取任何本机目录。</p><section class="settings-block"><h2>患者资料目录</h2><p>当前状态：<span class="status-pill pending">未连接 · 原型模拟</span></p><p class="help">正式版本将使用宿主支持的目录选择能力。取消选择不做更改；更换目录前需说明旧资料去向。</p><div class="action-row"><button class="button" data-toast="原型不会打开系统目录选择器">模拟选择资料目录</button><button class="button" data-toast="演示：未连接时不执行迁移">查看更换说明</button></div></section><section class="settings-block"><h2>医学参考资料</h2><p>当前包：指南来源与访问日期见“疾病概要”。状态：<span class="status-pill pending">待专业审核</span></p><p class="help">过期、未加载或未审核内容不会显示为当前个体建议。</p></section><section class="settings-block"><h2>AI 与云服务</h2><p>本原型没有真实AI会话、没有云解析凭据，也不会上传任何资料。</p><div class="checkrow"><input type="checkbox" id="cloudConsent"><label for="cloudConsent">原型演示：该选项不代表实际授权，不保存</label></div></section><section class="settings-block"><h2>保存更改</h2><div class="action-row"><button class="button primary" data-toast="原型未保存设置">保存（演示）</button><button class="button" data-view="home">取消并返回</button></div></section>`
};
function render(view,push=true){if(!views[view])return;if(push&&view!==current){historyStack.push(current);history.pushState({view},'',`#${view}`)}current=view;main.innerHTML=views[view];document.querySelectorAll('.navitem').forEach(x=>x.classList.toggle('active',x.dataset.view===view));main.focus({preventScroll:true});bindDynamic();window.scrollTo(0,0)}
function toastNode(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(toastNode.timer);toastNode.timer=setTimeout(()=>toast.classList.remove('show'),3200)}
function openDialog(title,text,action){document.getElementById('dialogTitle').textContent=title;document.getElementById('dialogText').textContent=text;dialogAction=action;previousFocus=document.activeElement;dialog.classList.add('open');document.getElementById('dialogCancel').focus()}
function closeDialog(){dialog.classList.remove('open');if(previousFocus)previousFocus.focus();dialogAction=null}
function bindDynamic(){main.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>render(b.dataset.view)));const call=document.getElementById('callHelp');if(call)call.addEventListener('click',()=>openDialog('演示呼救入口','这是交互原型，不会拨打电话。正式版本会根据部署地区显示已核验的急救号码，并由用户主动发起联系。',()=>toastNode('演示结束：请勿将原型用于真实急症')));
const make=document.getElementById('makeSummary');if(make)make.addEventListener('click',()=>{const symptoms=[...document.querySelectorAll('[name=symptom]:checked')].map(x=>x.value);const get=id=>document.getElementById(id)?.value||'未知/未提供';const lines=['急症交接摘要（由本人/照护者提供，未经核实）',`最后正常时间：${get('lastNormal')}`,`发现异常时间：${get('noticed')}`,`记录者：${get('observer')}`,`观察到的变化：${symptoms.join('、')||'未知/未提供'}`,`已知病史/过敏/目前用药：${get('history')}`];document.getElementById('summaryText').value=lines.join('\n');document.getElementById('summaryBlock').hidden=false});
const reset=document.getElementById('resetDraft');if(reset)reset.addEventListener('click',()=>openDialog('清空临时信息？','只清除本页演示填写，不影响任何患者档案。',()=>{document.getElementById('handoffForm').reset();document.getElementById('summaryBlock').hidden=true;toastNode('临时演示信息已清空')}));
const copy=document.getElementById('copySummary');if(copy)copy.addEventListener('click',async()=>{const val=document.getElementById('summaryText').value;try{await navigator.clipboard.writeText(val);toastNode('摘要已复制（原型）')}catch{document.getElementById('summaryText').focus();document.getElementById('summaryText').select();toastNode('自动复制不可用；文本已选中，可手动复制')}});
document.querySelectorAll('[data-toast]').forEach(b=>b.addEventListener('click',()=>toastNode(b.dataset.toast)))}
document.querySelectorAll('.navitem,[data-view]').forEach(b=>{if(!main.contains(b))b.addEventListener('click',()=>render(b.dataset.view))});
document.getElementById('primerOpen').addEventListener('click',()=>{previousFocus=document.activeElement;historyStack.push(current);history.pushState({primer:true},'','#primer');const p=document.getElementById('primerView');p.classList.add('open');p.setAttribute('aria-hidden','false');p.querySelector('[data-back]').focus()});
function closePrimer(){const p=document.getElementById('primerView');if(!p.classList.contains('open'))return;history.back()}
document.querySelectorAll('[data-back],[data-close]').forEach(b=>b.addEventListener('click',closePrimer));window.addEventListener('popstate',e=>{const p=document.getElementById('primerView');if(p.classList.contains('open')){p.classList.remove('open');p.setAttribute('aria-hidden','true');if(previousFocus)previousFocus.focus();return}const v=e.state?.view;if(v)render(v,false);else if(historyStack.length)render(historyStack.pop(),false)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(dialog.classList.contains('open'))closeDialog();else if(document.getElementById('primerView').classList.contains('open'))closePrimer();else if(agentOpen)toggleAgent(false)}});
document.getElementById('dialogCancel').addEventListener('click',closeDialog);document.getElementById('dialogConfirm').addEventListener('click',()=>{const a=dialogAction;closeDialog();if(a)a()});
function toggleAgent(open){const next=typeof open==='boolean'?open:!agentOpen;const layout=document.querySelector('.layout');if(next&&layout.clientWidth-(window.innerWidth<=620?68:window.innerWidth<=760?184:216)<400){toastNode('工作区较窄，AI面板保持收起以保留急症主区。');return}agentOpen=next;layout.classList.toggle('agent-open',agentOpen);document.getElementById('agentPane').classList.toggle('open',agentOpen);document.getElementById('agentToggle').textContent=agentOpen?'AI 对话已打开':'打开 AI 对话';document.getElementById('agentToggle').setAttribute('aria-expanded',String(agentOpen));document.getElementById('agentPane').setAttribute('aria-hidden',String(!agentOpen));if(agentOpen)setAgentWidth(Number(sep.getAttribute('aria-valuenow')))}
document.getElementById('agentToggle').addEventListener('click',()=>toggleAgent());document.getElementById('agentHide').addEventListener('click',()=>toggleAgent(false));document.querySelectorAll('[data-agent-state]').forEach(b=>b.addEventListener('click',()=>{const text={loading:'状态演示：正在连接…',error:'状态演示：连接失败。页面数据保留，可重试。',draft:'状态演示：检测到原生草稿；保留用户输入，不覆盖、不发送。'};document.getElementById('agentStateText').textContent=text[b.dataset.agentState]}));
const sep=document.getElementById('separator');function setAgentWidth(n){n=Math.max(25,Math.min(45,n));const layout=document.querySelector('.layout');const nav=window.innerWidth<=620?68:window.innerWidth<=760?184:216;const available=layout.clientWidth-nav-8;const min=window.innerWidth<=760?180:290;const max=Math.min(620,available*.45);const px=Math.round(Math.min(max,Math.max(Math.min(min,max),available*n/100)));layout.style.gridTemplateColumns=`${nav}px minmax(0,1fr) 8px ${px}px`;sep.setAttribute('aria-valuenow',String(n));sep.setAttribute('aria-valuetext',`${n}% 工作区宽度`)}let drag=false;sep.addEventListener('pointerdown',e=>{drag=true;sep.setPointerCapture(e.pointerId)});sep.addEventListener('pointermove',e=>{if(!drag)return;const layout=document.querySelector('.layout');const nav=window.innerWidth<=620?68:window.innerWidth<=760?184:216;const available=layout.clientWidth-nav-8;setAgentWidth((layout.getBoundingClientRect().right-e.clientX)/available*100)});sep.addEventListener('pointerup',()=>drag=false);sep.addEventListener('keydown',e=>{let n=Number(sep.getAttribute('aria-valuenow'));if(e.key==='ArrowLeft')n+=2;else if(e.key==='ArrowRight')n-=2;else if(e.key==='Home')n=25;else if(e.key==='End')n=45;else return;e.preventDefault();setAgentWidth(n)});window.addEventListener('resize',()=>{if(agentOpen)setAgentWidth(Number(sep.getAttribute('aria-valuenow')))});
render(location.hash==='#handoff'?'handoff':location.hash==='#records'?'records':location.hash==='#settings'?'settings':'home',false);
</script>
</body></html>
